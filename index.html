<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Query Watcher</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1f2523;
        --muted: #68736f;
        --line: #d8dfdc;
        --page: #f6f7f3;
        --panel: #ffffff;
        --accent: #167a58;
        --accent-2: #bf4b2f;
        --warn: #a96b00;
        --code: #26332f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page);
        color: var(--ink);
        font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }

      button,
      input {
        font: inherit;
      }

      .shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 26px 0 40px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.1;
        font-weight: 760;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        white-space: nowrap;
      }

      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--accent-2);
      }

      .dot.live {
        background: var(--accent);
      }

      .toolbar,
      .endpoint,
      .events {
        border: 1px solid var(--line);
        background: var(--panel);
        border-radius: 8px;
      }

      .toolbar {
        display: flex;
        gap: 10px;
        padding: 12px;
        align-items: center;
        justify-content: flex-end;
        margin-bottom: 12px;
      }

      .endpoint {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 12px;
        margin-bottom: 12px;
      }

      label {
        display: grid;
        gap: 5px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        color: var(--ink);
        background: #fff;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(22, 122, 88, 0.15);
      }

      button {
        min-height: 40px;
        border: 1px solid #b9c4c0;
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        padding: 8px 12px;
        cursor: pointer;
      }

      button.primary {
        border-color: var(--accent);
        background: var(--accent);
        color: #fff;
      }

      button.danger {
        border-color: #d9b7ad;
        color: #8f2e1d;
      }

      button:hover {
        filter: brightness(0.98);
      }

      .events {
        overflow: hidden;
      }

      .events-head,
      .event {
        display: grid;
        grid-template-columns: 174px 88px minmax(0, 1fr) 120px;
        gap: 12px;
        align-items: start;
      }

      .events-head {
        padding: 10px 14px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        border-bottom: 1px solid var(--line);
      }

      .event {
        padding: 14px;
        border-bottom: 1px solid var(--line);
      }

      .event:last-child {
        border-bottom: 0;
      }

      .event time,
      .event .method,
      .event .length {
        color: var(--muted);
      }

      .method {
        font-weight: 760;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        color: var(--code);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      .pill {
        display: inline-flex;
        width: fit-content;
        border: 1px solid #ead2ad;
        background: #fff7e8;
        color: var(--warn);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 760;
        margin-top: 8px;
      }

      .param-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .param-item {
        display: inline-flex;
        align-items: center;
        gap: 0;
        font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      }

      .param-key {
        background: #e8f4ef;
        color: var(--accent);
        border: 1px solid #b8ddd0;
        border-right: none;
        border-radius: 4px 0 0 4px;
        padding: 2px 8px;
        font-weight: 700;
      }

      .param-sep {
        background: #d0e8e0;
        color: var(--muted);
        border-top: 1px solid #b8ddd0;
        border-bottom: 1px solid #b8ddd0;
        padding: 2px 3px;
        font-size: 11px;
      }

      .param-val {
        background: #f6f7f3;
        color: var(--code);
        border: 1px solid #d8dfdc;
        border-left: none;
        border-radius: 0 4px 4px 0;
        padding: 2px 8px;
      }

      .param-count {
        font-size: 12px;
        color: var(--accent);
        font-weight: 700;
        background: #e8f4ef;
        border: 1px solid #b8ddd0;
        border-radius: 999px;
        padding: 2px 8px;
        white-space: nowrap;
      }

      .no-params {
        color: var(--muted);
        font-style: italic;
        font-size: 13px;
      }

      .empty {
        padding: 42px 14px;
        text-align: center;
        color: var(--muted);
      }

      @media (max-width: 760px) {
        .shell {
          width: min(100% - 20px, 1180px);
          padding-top: 16px;
        }

        header,
        .toolbar,
        .endpoint,
        .events-head,
        .event {
          grid-template-columns: 1fr;
        }

        header {
          align-items: flex-start;
        }

        h1 {
          font-size: 24px;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Query Watcher</h1>
        <div class="status" aria-live="polite"><span id="dot" class="dot"></span><span id="status">Waiting</span></div>
      </header>

      <section class="toolbar" aria-label="Controls">
        <button id="refresh" type="button">Refresh</button>
        <button id="clear" class="danger" type="button">Clear</button>
      </section>

      <section class="endpoint" aria-label="Endpoint">
        <label>
          Intake endpoint
          <input id="endpoint" readonly spellcheck="false">
        </label>
        <button id="copy" type="button">Copy</button>
      </section>

      <section class="events" aria-label="Events">
        <div class="events-head">
          <span>Time</span>
          <span>Method</span>
          <span>Query Params</span>
          <span>Count</span>
        </div>
        <div id="events"></div>
      </section>
    </main>

    <script>
      const endpointInput = document.getElementById("endpoint");
      const eventsEl = document.getElementById("events");
      const statusEl = document.getElementById("status");
      const dotEl = document.getElementById("dot");

      function endpoint() {
        return `${location.origin}/got`;
      }

      function updateEndpoint() {
        endpointInput.value = endpoint();
      }

      function setStatus(text, live) {
        statusEl.textContent = text;
        dotEl.classList.toggle("live", Boolean(live));
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[char]));
      }

      function renderParams(payload) {
        if (!payload) {
          return '<span class="no-params">No query params</span>';
        }
        const lines = payload.split("\n").filter(Boolean);
        const items = lines.map((line) => {
          const eqIdx = line.indexOf("=");
          if (eqIdx === -1) {
            return `<div class="param-item"><span class="param-key">${escapeHtml(line)}</span></div>`;
          }
          const k = line.slice(0, eqIdx);
          const v = line.slice(eqIdx + 1);
          return `<div class="param-item"><span class="param-key">${escapeHtml(k)}</span><span class="param-sep">=</span><span class="param-val">${escapeHtml(v)}</span></div>`;
        });
        return `<div class="param-list">${items.join("")}</div>`;
      }

      function renderEvents(events) {
        if (!events.length) {
          eventsEl.innerHTML = '<div class="empty">No events yet. Try visiting <code>/got?yourkey=yourvalue</code></div>';
          return;
        }

        eventsEl.innerHTML = events.map((event) => {
          const time = new Date(event.at).toLocaleString();
          const payload = event.payload || "";
          const paramCount = event.paramCount ?? (payload ? payload.split("\n").filter(Boolean).length : 0);
          const countBadge = paramCount > 0
            ? `<span class="param-count">${paramCount} param${paramCount !== 1 ? "s" : ""}</span>`
            : `<span class="no-params">0</span>`;
          return `
            <article class="event">
              <time>${escapeHtml(time)}</time>
              <span class="method">${escapeHtml(event.method || "GET")}</span>
              <div>${renderParams(payload)}</div>
              ${countBadge}
            </article>
          `;
        }).join("");
      }

      async function loadEvents() {
        try {
          const response = await fetch(`/api/events`);
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || "Could not load events.");
          }
          renderEvents(data.events || []);
          setStatus(`Live: ${(data.events || []).length} shown`, true);
        } catch (error) {
          setStatus(error.message, false);
        }
      }

      async function clearEvents() {
        try {
          const response = await fetch(`/api/events`, { method: "DELETE" });
          const data = await response.json();
          if (!response.ok || !data.ok) {
            throw new Error(data.error || "Could not clear events.");
          }
          renderEvents([]);
          setStatus("Cleared", true);
        } catch (error) {
          setStatus(error.message, false);
        }
      }

      document.getElementById("refresh").addEventListener("click", loadEvents);
      document.getElementById("clear").addEventListener("click", clearEvents);
      document.getElementById("copy").addEventListener("click", async () => {
        await navigator.clipboard.writeText(endpointInput.value);
        setStatus("Copied endpoint", true);
      });

      updateEndpoint();
      loadEvents();
      setInterval(loadEvents, 3500);
    </script>
  </body>
</html>
